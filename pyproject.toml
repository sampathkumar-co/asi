[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-seed"
version = "0.1.0"
description = "A controlled research foundation for measuring recursive capability amplification in LLM-based agents."
requires-python = ">=3.11"
authors = [{name = "Project Seed"}]
dependencies = []

[project.scripts]
seed = "seed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
