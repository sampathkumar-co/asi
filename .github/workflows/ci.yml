name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: seed eval-demo
      - run: seed gate0-certify --repo-root . --output artifacts/gate0-certificate.json
      - run: python -c "import json; d=json.load(open('artifacts/gate0-certificate.json')); assert d['passed'] is True"
      - run: seed gate1-certify --output artifacts/gate1-certificate.json
      - run: python -c "import json; d=json.load(open('artifacts/gate1-certificate.json')); assert d['passed'] is True"
      - run: seed demo
      - run: seed search-demo
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gate-certificates
          path: |
            artifacts/gate0-certificate.json
            artifacts/gate1-certificate.json
